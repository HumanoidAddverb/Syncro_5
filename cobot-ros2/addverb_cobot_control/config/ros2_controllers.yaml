controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # REGISTRATION
    $(var prefix)velocity_controller:
      type: addverb_cobot_controllers/VelocityController
    $(var prefix)ptp_joint_controller:
      type: addverb_cobot_controllers/PTPJointController
    $(var prefix)free_drive_controller:
      type: addverb_cobot_controllers/FreeDriveController
    $(var prefix)ptp_tcp_controller:
      type: addverb_cobot_controllers/PTPTCPController
    $(var prefix)recorder_controller:
      type: addverb_cobot_controllers/RecorderController
    $(var prefix)joint_jogging_controller:
      type: addverb_cobot_controllers/JointJoggingController
    $(var prefix)cartesian_jogging_controller:
      type: addverb_cobot_controllers/CartesianJoggingController
    $(var prefix)joint_impedance_controller:
      type: addverb_cobot_controllers/JointImpedanceController
    $(var prefix)cartesian_impedance_controller:
      type: addverb_cobot_controllers/CartesianImpedanceController
    $(var prefix)gravity_comp_effort_controller:
      type: addverb_cobot_controllers/GravityCompEffortController
    $(var prefix)effort_controller:
      type: addverb_cobot_controllers/EffortController
    $(var prefix)gripper_controller:
      type: addverb_cobot_controllers/GripperController
      
$(var prefix)velocity_controller:
  ros__parameters:
    joints:
        - $(var prefix)joint1
        - $(var prefix)joint2
        - $(var prefix)joint3
        - $(var prefix)joint4
        - $(var prefix)joint5
        - $(var prefix)joint6
    commands:
      - $(var prefix)joint1/velocity
      - $(var prefix)joint2/velocity
      - $(var prefix)joint3/velocity
      - $(var prefix)joint4/velocity
      - $(var prefix)joint5/velocity
      - $(var prefix)joint6/velocity
      - $(var prefix)controller_name/velocity
    states:
      - $(var prefix)robot_state/state    
      
$(var prefix)ptp_joint_controller:
  ros__parameters:
    joints:
      - $(var prefix)joint1
      - $(var prefix)joint2
      - $(var prefix)joint3
      - $(var prefix)joint4
      - $(var prefix)joint5
      - $(var prefix)joint6
    commands:
      - $(var prefix)joint1/position
      - $(var prefix)joint2/position
      - $(var prefix)joint3/position
      - $(var prefix)joint4/position
      - $(var prefix)joint5/position
      - $(var prefix)joint6/position
      - $(var prefix)time_cmd/time
      - $(var prefix)ptp_transfer/cmd
      - $(var prefix)controller_name/ptp_joint
    states:
      - $(var prefix)joint1/position
      - $(var prefix)joint2/position
      - $(var prefix)joint3/position
      - $(var prefix)joint4/position
      - $(var prefix)joint5/position
      - $(var prefix)joint6/position
      - $(var prefix)ptp_transfer/state
      - $(var prefix)robot_state/state

$(var prefix)free_drive_controller:
  ros__parameters:
    joints:
      - $(var prefix)joint1
      - $(var prefix)joint2
      - $(var prefix)joint3
      - $(var prefix)joint4
      - $(var prefix)joint5
