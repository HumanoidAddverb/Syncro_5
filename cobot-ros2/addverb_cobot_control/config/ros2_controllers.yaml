$(var prefix)ptp_tcp_controller:
  ros__parameters:
    joints:
      - $(var prefix)joint1
      - $(var prefix)joint2
      - $(var prefix)joint3
      - $(var prefix)joint4
      - $(var prefix)joint5
      - $(var prefix)joint6
    commands:
      - $(var prefix)tcp/x
      - $(var prefix)tcp/y
      - $(var prefix)tcp/z
      - $(var prefix)tcp/r
      - $(var prefix)tcp/p
      - $(var prefix)tcp/yaw
      - $(var prefix)tcp_time_cmd/time
      - $(var prefix)ptp_tcp_transfer/cmd
      - $(var prefix)controller_name/ptp_tcp
    states:
      - $(var prefix)tcp/x
      - $(var prefix)tcp/y
      - $(var prefix)tcp/z
      - $(var prefix)tcp/r
      - $(var prefix)tcp/p
      - $(var prefix)tcp/yaw
      - $(var prefix)ptp_tcp_transfer/state
      - $(var prefix)robot_state/state

$(var prefix)recorder_controller:
  ros__parameters:
    joints:
      - $(var prefix)joint1
      - $(var prefix)joint2
      - $(var prefix)joint3
      - $(var prefix)joint4
      - $(var prefix)joint5
      - $(var prefix)joint6
    commands:
        - $(var prefix)joint1/position
        - $(var prefix)joint2/position
        - $(var prefix)joint3/position
        - $(var prefix)joint4/position
        - $(var prefix)joint5/position
        - $(var prefix)joint6/position
        - $(var prefix)time_cmd/time
        - $(var prefix)ptp_transfer/cmd
        - $(var prefix)record_cmd/iterations
        - $(var prefix)controller_name/recorder

    states:
        - $(var prefix)joint1/position
        - $(var prefix)joint2/position
        - $(var prefix)joint3/position
        - $(var prefix)joint4/position
        - $(var prefix)joint5/position
        - $(var prefix)joint6/position
        - $(var prefix)ptp_transfer/state
        - $(var prefix)robot_state/state

    max_recording_rate: 30
    position_tolerance: 0.001
    time_tolerance: 15.0


      
